<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Place in time</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"><style>html,body{width:390px;height:844px;overflow:hidden}.nbl{position:absolute;top:36px;width:96px;margin-left:-48px;text-align:center;font-size:14px;line-height:17px;font-weight:600;color:var(--ink)}</style></head><body><div class="screen paper-bg">
<header class="appbar"><button class="icon-btn" aria-label="Back"><svg class="ico " viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button><span class="t-label grow" style="font-size:18px">Place this story</span><span class="t-caption" style="padding-right:8px">Step 1 of 2</span></header>
<div class="steps"><i class="on"></i><i></i></div>
<div class="pad" style="margin-top:18px">
 <div class="row gap12" style="padding:12px 14px;border-radius:14px;background:rgba(251,248,241,.75);border:1px solid var(--line)">
  <span style="width:44px;height:44px;border-radius:12px;background:var(--rust-tint);color:var(--rust);display:grid;place-items:center"><svg class="ico " viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg></span>
  <div><div class="t-caption" style="font-size:14px">New story · 4:12</div><div class="t-h3" style="font-size:19px;line-height:24px">The House on Elm Street</div></div></div>
 <h1 class="t-h1" style="margin-top:20px;font-size:30px">When did this happen?</h1>
 <p class="t-body soft" style="margin-top:6px">Was this before or after</p>
 <p class="t-h2" style="margin-top:2px">The Movie Theater?</p>
 <div class="row gap12" style="margin-top:16px">
  <button class="btn btn-secondary btn-big grow" style="border-width:2px;border-color:var(--ink)"><svg class="ico lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>Before</button>
  <button class="btn btn-secondary btn-big grow" style="border-width:2px;border-color:var(--ink)"><svg class="ico lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>After</button></div>
 <div class="card" style="margin-top:18px;padding:14px 16px 10px">
  <div class="row" style="justify-content:space-between"><span class="t-label">Where it might fit</span><span class="t-caption">2 more questions</span></div>
  <div class="tl" style="height:70px;margin-top:4px"><div class="track"></div>
   <i class="dot" style="left:3%"></i><i class="dot nb" style="left:19%"></i><i class="dot new" style="left:49%">?</i><i class="dot nb" style="left:79%"></i><i class="dot" style="left:91%"></i><i class="dot" style="left:98%"></i>
   <div class="nbl" style="left:19%">First Day<br>of School</div><div class="nbl" style="left:49%;color:var(--rust-dark)">This<br>story</div><div class="nbl" style="left:79%">The Movie<br>Theater</div></div>
 </div>
 <div style="margin-top:18px"><label class="t-label">About how old were you? <span class="soft" style="font-weight:500">(optional)</span></label>
  <div class="row gap8" style="margin-top:8px">
   <button class="icon-btn outline" style="width:56px;height:56px;border-radius:14px" aria-label="Younger"><svg class="ico " viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
   <div style="width:96px;height:56px;border-radius:14px;border:1.5px solid #cdbfa8;background:var(--paper);display:grid;place-items:center" class="serif tab"><span style="font-size:26px;font-weight:500">7</span></div>
   <button class="icon-btn outline" style="width:56px;height:56px;border-radius:14px" aria-label="Older"><svg class="ico " viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
   <span class="t-body soft" style="margin-left:4px">years old</span></div>
  <button class="btn-ghost" style="font-size:16px;font-weight:600;margin-top:10px;height:32px">Or enter a year</button></div>
</div>
<div style="position:absolute;left:24px;right:24px;bottom:22px"><button class="btn btn-quiet btn-block">I'm not sure. Skip for now</button></div>
</div></body></html>
