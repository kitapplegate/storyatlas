<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Record ready</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"><style>html,body{width:390px;height:844px;overflow:hidden}.wave i{display:block;width:4px;border-radius:2px;background:var(--rust)}</style></head><body><div class="screen paper-bg"><header class="appbar"><button class="icon-btn" aria-label="Back"><svg class="ico " viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button><span class="t-label grow" style="font-size:18px">New story</span><span class="t-caption" style="padding-right:8px">for Grandpa Joe</span></header><div class="pad" style="margin-top:8px"><div class="card" style="padding:18px 18px 16px;border-left:5px solid var(--rust)">
 <div class="t-over" style="color:var(--rust-dark)">A question to start</div>
 <p class="t-h2" style="margin-top:8px">Tell me about the house you grew up in.</p>
 <p class="t-caption" style="margin-top:8px">What did it look like? Who lived there with you?</p>

<p class="t-h2" style="text-align:center;margin-top:46px">Record a story</p>
<p class="t-body soft" style="text-align:center;margin-top:4px">Tap once to start. Take your time.</p>
